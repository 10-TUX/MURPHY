<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MURPHY — AI Codebase Assistant · Project Checklist</title>
  <meta name="description" content="Complete interactive project checklist for the MURPHY AI Codebase Assistant">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary:   #0b0f19;
      --bg-card:      #111827;
      --bg-card-alt:  #1a2235;
      --bg-hover:     #1e293b;
      --border:       #1e293b;
      --border-glow:  rgba(99,102,241,.25);
      --text-primary: #e2e8f0;
      --text-secondary:#94a3b8;
      --text-muted:   #64748b;
      --accent:       #818cf8;
      --accent-vivid: #6366f1;
      --accent-glow:  rgba(99,102,241,.35);
      --green:        #34d399;
      --green-glow:   rgba(52,211,153,.25);
      --amber:        #fbbf24;
      --rose:         #fb7185;
      --radius:       12px;
      --transition:   .25s cubic-bezier(.4,0,.2,1);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated Background ──────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(99,102,241,.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(52,211,153,.06) 0%, transparent 60%);
      z-index: -1;
      pointer-events: none;
    }

    /* ── Header ───────────────────────────────────────── */
    header {
      text-align: center;
      padding: 3rem 1.5rem 1rem;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.02em;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      margin-top: .5rem;
      max-width: 600px;
      margin-inline: auto;
    }

    /* ── Progress Bar ─────────────────────────────────── */
    .progress-wrap {
      max-width: 820px;
      margin: 1.5rem auto 2rem;
      padding: 0 1.5rem;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: .85rem;
      color: var(--text-muted);
      margin-bottom: .5rem;
    }

    .progress-stats span strong {
      color: var(--accent);
      font-weight: 700;
    }

    .progress-bar-bg {
      height: 10px;
      border-radius: 99px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent-vivid), var(--green));
      width: 0%;
      transition: width .5s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ── Controls ─────────────────────────────────────── */
    .controls {
      display: flex;
      gap: .75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      padding: 0 1.5rem;
    }

    .controls button {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: .82rem;
      font-weight: 500;
      padding: .5rem 1.1rem;
      border-radius: 99px;
      cursor: pointer;
      transition: var(--transition);
    }

    .controls button:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--border-glow);
    }

    .controls button.active {
      background: var(--accent-vivid);
      border-color: var(--accent-vivid);
      color: #fff;
    }

    .btn-danger {
      color: var(--rose) !important;
      border-color: rgba(251,113,133,.3) !important;
    }

    .btn-danger:hover {
      background: rgba(251,113,133,.12) !important;
      border-color: var(--rose) !important;
    }

    /* ── Main Container ───────────────────────────────── */
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    /* ── Phase Section ────────────────────────────────── */
    .phase {
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      overflow: hidden;
      transition: var(--transition);
    }

    .phase:hover {
      border-color: var(--border-glow);
    }

    .phase-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1rem 1.25rem;
      cursor: pointer;
      user-select: none;
      transition: var(--transition);
    }

    .phase-header:hover {
      background: var(--bg-hover);
    }

    .phase-chevron {
      width: 20px;
      height: 20px;
      transition: transform .3s ease;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .phase.collapsed .phase-chevron {
      transform: rotate(-90deg);
    }

    .phase-title {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .phase-badge {
      font-size: .72rem;
      font-weight: 600;
      padding: .2rem .65rem;
      border-radius: 99px;
      background: rgba(99,102,241,.12);
      color: var(--accent);
      white-space: nowrap;
    }

    .phase-badge.done {
      background: rgba(52,211,153,.12);
      color: var(--green);
    }

    .phase-body {
      max-height: 2000px;
      overflow: hidden;
      transition: max-height .4s ease;
    }

    .phase.collapsed .phase-body {
      max-height: 0;
    }

    /* ── Task Item ────────────────────────────────────── */
    .task {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      padding: .65rem 1.25rem .65rem 2.5rem;
      border-top: 1px solid var(--border);
      transition: var(--transition);
    }

    .task:hover {
      background: var(--bg-hover);
    }

    .task input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      min-width: 20px;
      border: 2px solid var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      margin-top: 2px;
      transition: var(--transition);
      background: transparent;
    }

    .task input[type="checkbox"]:hover {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .task input[type="checkbox"]:checked {
      background: var(--accent-vivid);
      border-color: var(--accent-vivid);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .task input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 6px;
      height: 11px;
      border: solid #fff;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }

    .task label {
      cursor: pointer;
      font-size: .92rem;
      color: var(--text-primary);
      line-height: 1.55;
      transition: var(--transition);
    }

    .task.checked label {
      color: var(--text-muted);
      text-decoration: line-through;
      text-decoration-color: var(--text-muted);
    }

    .task .tag {
      font-size: .68rem;
      font-weight: 600;
      padding: .15rem .5rem;
      border-radius: 99px;
      white-space: nowrap;
      margin-top: 3px;
      flex-shrink: 0;
    }

    .tag-core      { background: rgba(99,102,241,.12); color: var(--accent); }
    .tag-ai        { background: rgba(251,191,36,.12); color: var(--amber); }
    .tag-frontend  { background: rgba(52,211,153,.12); color: var(--green); }
    .tag-deploy    { background: rgba(251,113,133,.12); color: var(--rose); }
    .tag-future    { background: rgba(148,163,184,.12); color: var(--text-secondary); }
    .tag-test      { background: rgba(56,189,248,.12); color: #38bdf8; }
    .tag-docs      { background: rgba(192,132,252,.12); color: #c084fc; }

    /* ── Footer ───────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: .8rem;
      border-top: 1px solid var(--border);
    }

    /* ── Animations ───────────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .phase {
      animation: fadeIn .45s ease both;
    }

    .phase:nth-child(2)  { animation-delay: .05s; }
    .phase:nth-child(3)  { animation-delay: .10s; }
    .phase:nth-child(4)  { animation-delay: .15s; }
    .phase:nth-child(5)  { animation-delay: .20s; }
    .phase:nth-child(6)  { animation-delay: .25s; }
    .phase:nth-child(7)  { animation-delay: .30s; }
    .phase:nth-child(8)  { animation-delay: .35s; }
    .phase:nth-child(9)  { animation-delay: .40s; }
    .phase:nth-child(10) { animation-delay: .45s; }
    .phase:nth-child(11) { animation-delay: .50s; }
    .phase:nth-child(12) { animation-delay: .55s; }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 600px) {
      .task { padding-left: 1.25rem; }
      .controls { gap: .4rem; }
      .controls button { font-size: .75rem; padding: .4rem .75rem; }
    }

    /* ── Confetti Canvas ──────────────────────────────── */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>

<canvas id="confetti-canvas"></canvas>

</div>

<main id="checklist"></main>

      { id: "p13-01", text: "GitHub repository integration (clone directly via URL)", tag: "future" },
      { id: "p13-02", text: "Incremental indexing (re-index only changed files)", tag: "future" },
      { id: "p13-03", text: "Live repository synchronization", tag: "future" },
      { id: "p13-04", text: "Pull request review assistant", tag: "future" },
      { id: "p13-05", text: "Code quality analysis", tag: "future" },
      { id: "p13-06", text: "Security vulnerability detection", tag: "future" },
      { id: "p13-07", text: "Test case generation", tag: "future" },
      { id: "p13-08", text: "UML diagram generation", tag: "future" },
      { id: "p13-09", text: "Sequence diagram generation", tag: "future" },
      { id: "p13-10", text: "Code dependency visualization", tag: "future" },
      { id: "p13-11", text: "Team collaboration features", tag: "future" },
      { id: "p13-12", text: "VS Code Extension", tag: "future" },
      { id: "p13-13", text: "CLI interface", tag: "future" },
      { id: "p13-14", text: "Docker containerization", tag: "future" },
      { id: "p13-15", text: "Multi-user workspace with authentication & authorization", tag: "future" },
      { id: "p13-16", text: "Line-range source attribution in responses", tag: "future" },
      { id: "p13-17", text: "Tree-sitter integration for advanced multi-language parsing", tag: "future" },
      { id: "p13-18", text: "Migrate frontend to React for richer UI", tag: "future" },
    ]
  },
];

const TAG_LABELS = {
  core: "CORE", ai: "AI / RAG", frontend: "FRONTEND",
  deploy: "DEPLOY", future: "FUTURE", test: "TESTING", docs: "DOCS"
};

// ── STATE ──────────────────────────────────────────────
const STORAGE_KEY = "murphy-checklist-v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
let currentFilter = "all";

// ── RENDER ─────────────────────────────────────────────
const main = document.getElementById("checklist");

function render() {
  main.innerHTML = "";
  let totalTasks = 0, doneTasks = 0;

  phases.forEach((phase, pi) => {
    const phaseEl = document.createElement("div");
    phaseEl.className = "phase";

    const phaseDone = phase.tasks.filter(t => state[t.id]).length;
    const phaseTotal = phase.tasks.length;
    totalTasks += phaseTotal;
    doneTasks += phaseDone;

    const allDone = phaseDone === phaseTotal;

    // Header
    phaseEl.innerHTML = `
      <div class="phase-header" onclick="togglePhase(${pi})">
        <svg class="phase-chevron" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"/>
        </svg>
        <span class="phase-title">${phase.title}</span>
        <span class="phase-badge ${allDone ? 'done' : ''}">${phaseDone} / ${phaseTotal}</span>
      </div>
      <div class="phase-body" id="phase-body-${pi}"></div>
    `;

    const body = phaseEl.querySelector(".phase-body");

    phase.tasks.forEach(task => {
      const checked = !!state[task.id];
      if (currentFilter === "done" && !checked) return;
      if (currentFilter === "pending" && checked) return;

      const taskEl = document.createElement("div");
      taskEl.className = "task" + (checked ? " checked" : "");
      taskEl.innerHTML = `
        <input type="checkbox" id="${task.id}" ${checked ? "checked" : ""}>
        <label for="${task.id}">${task.text}</label>
        <span class="tag tag-${task.tag}">${TAG_LABELS[task.tag]}</span>
      `;
      taskEl.querySelector("input").addEventListener("change", e => {
        state[task.id] = e.target.checked;
        saveState(state);
        render();
        if (e.target.checked) checkConfetti();
      });
      body.appendChild(taskEl);
    });

    main.appendChild(phaseEl);
  });

  // Progress
  document.getElementById("done-count").textContent = doneTasks;
  document.getElementById("total-count").textContent = totalTasks;
  const pct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;
  document.getElementById("percent-label").textContent = pct + " %";
  document.getElementById("progress-fill").style.width = pct + "%";
}

// ── INTERACTIONS ───────────────────────────────────────
function togglePhase(i) {
  const phases = document.querySelectorAll(".phase");
  phases[i].classList.toggle("collapsed");
}

function expandAll() {
  document.querySelectorAll(".phase").forEach(p => p.classList.remove("collapsed"));
}

function collapseAll() {
  document.querySelectorAll(".phase").forEach(p => p.classList.add("collapsed"));
}

function filterTasks(filter) {
  currentFilter = filter;
  document.querySelectorAll("[data-filter]").forEach(b => b.classList.remove("active"));
  document.querySelector(`[data-filter="${filter}"]`).classList.add("active");
  render();
}

function resetAll() {
  if (!confirm("Reset ALL checkboxes? This cannot be undone.")) return;
  state = {};
  saveState(state);
  render();
}

// ── CONFETTI (lightweight celebration) ─────────────────
function checkConfetti() {
  const total = phases.reduce((s, p) => s + p.tasks.length, 0);
  const done  = phases.reduce((s, p) => s + p.tasks.filter(t => state[t.id]).length, 0);
  if (done === total) launchConfetti();
  // Also celebrate phase completion
  phases.forEach(phase => {
    if (phase.tasks.every(t => state[t.id])) {
      miniConfetti();
    }
  });
}

function miniConfetti() {
  const canvas = document.getElementById("confetti-canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  const colors = ["#818cf8","#34d399","#fbbf24","#fb7185","#38bdf8","#c084fc"];
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -10,
      vx: (Math.random() - .5) * 4,
      vy: Math.random() * 3 + 2,
      size: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      spin: (Math.random() - .5) * 10,
      life: 1,
    });
  }
  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += .08;
      p.rotation += p.spin;
      p.life -= .012;
      if (p.life <= 0) return;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .6);
      ctx.restore();
    });
    frame++;
    if (frame < 120 && particles.some(p => p.life > 0)) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}

function launchConfetti() {
  const canvas = document.getElementById("confetti-canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  const colors = ["#818cf8","#34d399","#fbbf24","#fb7185","#38bdf8","#c084fc","#fff"];
  for (let i = 0; i < 200; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - .5) * 16,
      vy: (Math.random() - .5) * 16 - 4,
      size: Math.random() * 8 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      spin: (Math.random() - .5) * 15,
      life: 1,
    });
  }
  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += .12;
      p.vx *= .99;
      p.rotation += p.spin;
      p.life -= .006;
      if (p.life <= 0) return;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .5);
      ctx.restore();
    });
    frame++;
    if (frame < 250 && particles.some(p => p.life > 0)) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}

// ── INIT ───────────────────────────────────────────────
render();
</script>
